[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cns-hybrid-messaging"
version = "1.0.0"
description = "Multi-stage hybrid cryptographic framework for secure local messaging"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43.0.0",
  "argon2-cffi>=23.1.0",
  "kyber-py>=1.0.1",
  "dilithium-py>=1.0.2",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pyftpdlib>=1.5.10",
  "python-multipart>=0.0.9",
  "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
cns = "cns.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cns = ["web/static/*", "web/templates/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
